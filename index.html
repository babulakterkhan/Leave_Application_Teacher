<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শিক্ষক ছুটির আবেদন পত্র</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);padding:20px;font-family:'Noto Sans Bengali',Arial,sans-serif}
        .header{text-align:center;margin-bottom:30px;color:white}
        .header h1{font-size:32px;margin-bottom:10px;text-shadow:2px 2px 4px rgba(0,0,0,.3)}
        .header p{font-size:16px;opacity:.9}
        .container{display:flex;gap:30px;max-width:1400px;margin:0 auto;flex-wrap:wrap;justify-content:center}
        .form-card,.output-card{flex:1;min-width:350px;max-width:500px;background:white;border-radius:15px;padding:25px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
        .form-card h2,.output-card h2{color:#4a5568;margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid #e2e8f0;font-size:20px}
        .form-group{margin-bottom:15px}
        .form-group label{display:block;margin-bottom:5px;color:#4a5568;font-weight:500}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:8px;font-size:16px;outline:none;transition:border-color .3s}
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#667eea}
        .leave-duration{display:flex;gap:15px;margin-bottom:15px;padding:15px;background:#f0fff4;border-radius:10px;border:1px solid #9ae6b4}
        .leave-duration label{display:flex;align-items:center;gap:8px;cursor:pointer;padding:10px 20px;border-radius:8px;transition:all .3s;border:2px solid transparent}
        .leave-duration label:hover{background:#c6f6d5}
        .leave-duration input[type="radio"]{width:18px;height:18px;cursor:pointer}
        .leave-duration input[type="radio"]:checked+span{font-weight:600;color:#667eea}
        .leave-duration label:has(input:checked){background:#e8eaff;border-color:#667eea}
        .date-group{display:flex;gap:10px}
        .date-group .form-group{flex:1}
        .single-date{max-width:50%}
        .btn-group{display:flex;gap:10px;margin-top:20px}
        .btn-primary{flex:1;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(0,0,0,.2)}
        .btn-reset{padding:14px 20px;background:#e2e8f0;color:#4a5568;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
        .btn-print{padding:12px 24px;background:linear-gradient(135deg,#11998e,#38ef7d);color:white;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
        .output-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid #e2e8f0}
        .application-letter{padding:var(--margin-size,20px);border:1px solid #e2e8f0;border-radius:8px;line-height:var(--line-height,2);font-size:var(--font-size,16px)}
        .slider-control{background:#f8f9fa;padding:15px;border-radius:10px;margin-bottom:15px}
        .slider-control label{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:#4a5568;font-weight:500}
        .slider{width:100%;height:8px;border-radius:4px;outline:none;-webkit-appearance:none;cursor:pointer}
        .margin-slider{background:linear-gradient(to right,#e2e8f0,#11998e)}
        .lineheight-slider{background:linear-gradient(to right,#e2e8f0,#667eea)}
        .fontsize-slider{background:linear-gradient(to right,#e2e8f0,#e74c3c)}
        .slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
        .margin-slider::-webkit-slider-thumb{background:linear-gradient(135deg,#11998e,#38ef7d)}
        .lineheight-slider::-webkit-slider-thumb{background:linear-gradient(135deg,#667eea,#764ba2)}
        .fontsize-slider::-webkit-slider-thumb{background:linear-gradient(135deg,#e74c3c,#c0392b)}
        .slider-value{padding:4px 12px;border-radius:20px;font-size:14px;font-weight:600;color:white}
        .margin-value{background:#11998e}.lineheight-value{background:#667eea}.fontsize-value{background:#e74c3c}
        .letter-date{text-align:right;margin-bottom:15px}
        .letter-subject{margin-bottom:15px}
        .letter-body{text-indent:40px;text-align:justify;margin-bottom:15px}
        .letter-signature{text-align:right;margin-top:40px}
        .letter-signature .signature-content{display:inline-block;text-align:center}
        .placeholder{padding:40px;text-align:center;color:#718096}
        .placeholder-icon{font-size:60px;margin-bottom:20px}
        .footer{text-align:center;margin-top:30px;color:white;opacity:.8;font-size:14px}
        .hidden{display:none!important}
        .info-row{display:flex;gap:10px}
        .info-row .form-group{flex:1}
        .inst-type{display:flex;gap:15px;margin-bottom:15px;padding:15px;background:#e8eaff;border-radius:10px;border:1px solid #b3b3ff}
        .inst-type label{display:flex;align-items:center;gap:8px;cursor:pointer;padding:10px 20px;border-radius:8px;transition:all .3s;border:2px solid transparent}
        .inst-type label:hover{background:#d4d4ff}
        .inst-type input[type="radio"]{width:18px;height:18px;cursor:pointer}
        .inst-type input[type="radio"]:checked+span{font-weight:600;color:#667eea}
        .inst-type label:has(input:checked){background:#b3b3ff;border-color:#667eea}
        .saved-section{background:#e8f5e9;padding:15px;border-radius:10px;margin-top:15px;border:1px solid #4caf50}
        .saved-section h3{color:#2e7d32;font-size:14px;margin-bottom:10px}
        .save-name-input{display:flex;gap:10px;margin-bottom:10px}
        .save-name-input input{flex:1;padding:10px;border:2px solid #c8e6c9;border-radius:8px;font-size:14px}
        .btn-save{padding:10px 15px;background:linear-gradient(135deg,#4caf50,#2e7d32);color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
        .saved-list{max-height:200px;overflow-y:auto;border:1px solid #c8e6c9;border-radius:8px;margin-bottom:10px}
        .saved-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #e8f5e9;background:white;cursor:pointer}
        .saved-item:hover{background:#f1f8e9}
        .saved-item:last-child{border-bottom:none}
        .saved-info{flex:1}
        .saved-name{font-weight:600;color:#333;font-size:14px}
        .saved-date{font-size:11px;color:#666}
        .saved-actions{display:flex;gap:5px}
        .btn-load{padding:5px 10px;background:#2196f3;color:white;border:none;border-radius:5px;font-size:11px;cursor:pointer}
        .btn-delete{padding:5px 10px;background:#f44336;color:white;border:none;border-radius:5px;font-size:11px;cursor:pointer}
        .no-saved{padding:20px;text-align:center;color:#666;font-size:13px}
        .counter{font-size:12px;color:#2e7d32;margin-bottom:10px}
        .export-import{display:flex;gap:10px}
        .btn-export{flex:1;padding:10px;background:linear-gradient(135deg,#9c27b0,#7b1fa2);color:white;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
        .btn-import{flex:1;padding:10px;background:linear-gradient(135deg,#ff5722,#e64a19);color:white;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:8px;color:white;font-weight:600;z-index:9999;animation:fadeInOut 3s ease-in-out;box-shadow:0 5px 20px rgba(0,0,0,.2)}
        .toast-success{background:linear-gradient(135deg,#27ae60,#2ecc71)}
        .toast-error{background:linear-gradient(135deg,#e74c3c,#c0392b)}
        @keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(20px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}85%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}
        @media print{body{background:white;padding:0}.form-card,.header,.footer,.no-print,.output-header{display:none!important}.output-card{box-shadow:none;border:none;max-width:100%;padding:0}.application-letter{border:none}@page{margin:10mm;size:A4}}
        @media (max-width:768px){.container{flex-direction:column}.form-card,.output-card{max-width:100%}.date-group,.info-row{flex-direction:column}.single-date{max-width:100%}.leave-duration{flex-direction:column;gap:10px}.export-import{flex-direction:column}.inst-type{flex-direction:column;gap:10px}}
    </style>
</head>
<body>
    <div class="header">
        <h1>👨‍🏫 শিক্ষক ছুটির আবেদন পত্র</h1>
        <p>ফর্মটি পূরণ করুন এবং আবেদন পত্র প্রিন্ট করুন</p>
    </div>
    <div class="container">
        <div class="form-card">
            <h2>📝 তথ্য পূরণ করুন</h2>
            <form id="leaveForm">
                <div class="form-group"><label>প্রতিষ্ঠানের ধরন *</label>
                    <div class="inst-type">
                        <label><input type="radio" name="instType" value="school" checked onchange="toggleInstType()"><span>🏫 স্কুল</span></label>
                        <label><input type="radio" name="instType" value="college" onchange="toggleInstType()"><span>🎓 কলেজ</span></label>
                        <label><input type="radio" name="instType" value="other" onchange="toggleInstType()"><span>📋 অন্যান্য</span></label>
                    </div>
                </div>
                <div id="customHeadSection" class="hidden">
                    <div class="form-group"><label>প্রধানের পদবী</label><input type="text" id="customHead" placeholder="যেমন: অধ্যক্ষ, সুপার, ডাইরেক্টর"></div>
                </div>
                <div class="form-group"><label>আবেদনকারীর নাম *</label><input type="text" id="applicantName" placeholder="আপনার নাম লিখুন" required></div>
                <div class="form-group"><label>পদবী *</label><input type="text" id="designation" placeholder="যেমন: সহকারী শিক্ষক" required></div>
                <div class="form-group"><label>বিভাগ/বিষয়</label><input type="text" id="department" placeholder="যেমন: গণিত"></div>
                <div class="form-group"><label>ছুটির ধরন *</label><select id="leaveType" required>
                    <option value="বেতনহীন ছুটি">বেতনহীন ছুটি</option>
                    <option value="বার্ষিক ছুটি">বার্ষিক ছুটি</option>
                    <option value="অসুস্থতা জনিত ছুটি">অসুস্থতা জনিত ছুটি</option>
                    <option value="বিশেষ ছুটি">বিশেষ ছুটি</option>
                    <option value="মাতৃত্বকালীন ছুটি">মাতৃত্বকালীন ছুটি</option>
                    <option value="ছুটি">ছুটি</option>
                </select></div>
                <div class="form-group"><label>ছুটির মেয়াদ *</label>
                    <div class="leave-duration">
                        <label><input type="radio" name="leaveDuration" value="single" checked onchange="toggleDateFields()"><span>📅 একদিনের ছুটি</span></label>
                        <label><input type="radio" name="leaveDuration" value="multiple" onchange="toggleDateFields()"><span>📆 একাধিক দিনের ছুটি</span></label>
                    </div>
                </div>
                <div id="singleDaySection"><div class="form-group single-date"><label>ছুটির তারিখ *</label><input type="date" id="singleDate" required></div></div>
                <div id="multipleDaySection" class="hidden">
                    <div class="date-group">
                        <div class="form-group"><label>শুরুর তারিখ *</label><input type="date" id="startDate"></div>
                        <div class="form-group"><label>শেষের তারিখ *</label><input type="date" id="endDate"></div>
                    </div>
                    <div class="form-group"><label>মোট দিন *</label><input type="number" id="totalDays" placeholder="যেমন: 5" min="1"></div>
                </div>
                <div class="form-group"><label>ছুটির কারণ *</label><textarea id="reason" rows="3" placeholder="ছুটির কারণ বিস্তারিত লিখুন..." required></textarea></div>
                <div class="form-group"><label>প্রতিষ্ঠানের নাম</label><input type="text" id="schoolName" value="উদাহরণ উচ্চ বিদ্যালয়"></div>
                <div class="form-group"><label>প্রতিষ্ঠানের ঠিকানা</label><input type="text" id="schoolAddress" value="গ্রাম: উদাহরণ, জেলা: উদাহরণ"></div>
                <div class="btn-group">
                    <button type="submit" class="btn-primary">📄 আবেদন তৈরি করুন</button>
                    <button type="button" class="btn-reset" onclick="resetForm()">🔄</button>
                </div>
                <div class="saved-section">
                    <h3>📋 সেভ করা আবেদন</h3>
                    <div class="counter" id="counter">সর্বমোট: ০টি</div>
                    <div class="save-name-input">
                        <input type="text" id="saveName" placeholder="নাম দিন (যেমন: রহিম বার্ষিক ছুটি)">
                        <button type="button" class="btn-save" onclick="saveApplication()">💾 সেভ</button>
                    </div>
                    <div class="saved-list" id="savedList"><div class="no-saved">কোনো সেভ করা আবেদন নেই</div></div>
                    <div class="export-import">
                        <button type="button" class="btn-export" onclick="exportJSON()">📤 JSON ডাউনলোড</button>
                        <button type="button" class="btn-import" onclick="document.getElementById('importFile').click()">📥 JSON আপলোড</button>
                        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
                    </div>
                </div>
            </form>
        </div>
        <div class="output-card">
            <div id="placeholder" class="placeholder"><div class="placeholder-icon">📄</div><h3>আবেদন পত্র প্রিভিউ</h3><p>ফর্মটি পূরণ করে "আবেদন তৈরি করুন" বাটনে ক্লিক করুন</p></div>
            <div id="output" style="display:none">
                <div class="output-header no-print"><h2>📋 আবেদন পত্র প্রিভিউ</h2><button class="btn-print" onclick="window.print()">🖨️ প্রিন্ট করুন</button></div>
                <div class="slider-control no-print"><label><span>📏 মার্জিন:</span><span class="slider-value margin-value" id="marginValue">20px</span></label><input type="range" class="slider margin-slider" id="marginSlider" min="5" max="60" value="20" oninput="updateMargin(this.value)"></div>
                <div class="slider-control no-print"><label><span>📝 লাইন হাইট:</span><span class="slider-value lineheight-value" id="lineHeightValue">2.0</span></label><input type="range" class="slider lineheight-slider" id="lineHeightSlider" min="1.2" max="3" step="0.1" value="2" oninput="updateLineHeight(this.value)"></div>
                <div class="slider-control no-print"><label><span>🔤 ফন্ট সাইজ:</span><span class="slider-value fontsize-value" id="fontSizeValue">16px</span></label><input type="range" class="slider fontsize-slider" id="fontSizeSlider" min="10" max="24" value="16" oninput="updateFontSize(this.value)"></div>
                <div class="application-letter" id="applicationLetter"></div>
            </div>
        </div>
    </div>
    <div class="footer">© 2024 শিক্ষক ছুটির আবেদন পত্র জেনারেটর</div>
    <script>
        function toBengaliNumber(n){var d=['০','১','২','৩','৪','৫','৬','৭','৮','৯'];return String(n).replace(/[0-9]/g,function(s){return d[parseInt(s)]})}
        function showToast(m,t){var e=document.createElement('div');e.className='toast toast-'+t;e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove()},3000)}
        function toggleInstType(){var t=document.querySelector('input[name="instType"]:checked').value;if(t==='other'){document.getElementById('customHeadSection').classList.remove('hidden')}else{document.getElementById('customHeadSection').classList.add('hidden')}}
        function getHeadTitle(){var t=document.querySelector('input[name="instType"]:checked').value;if(t==='school')return 'প্রধান শিক্ষক';if(t==='college')return 'অধ্যক্ষ';return document.getElementById('customHead').value||'অধ্যক্ষ'}
        function toggleDateFields(){var i=document.querySelector('input[name="leaveDuration"]:checked').value==='single';if(i){document.getElementById('singleDaySection').classList.remove('hidden');document.getElementById('multipleDaySection').classList.add('hidden')}else{document.getElementById('singleDaySection').classList.add('hidden');document.getElementById('multipleDaySection').classList.remove('hidden')}}
        function getBengaliDate(){return new Date().toLocaleDateString('bn-BD',{year:'numeric',month:'long',day:'numeric'})}
        function formatDate(d){if(!d)return'';var t=new Date(d);return toBengaliNumber(t.getDate())+'/'+toBengaliNumber(t.getMonth()+1)+'/'+toBengaliNumber(t.getFullYear())}
        function getFormData(){return{instType:document.querySelector('input[name="instType"]:checked').value,customHead:document.getElementById('customHead').value,applicantName:document.getElementById('applicantName').value,designation:document.getElementById('designation').value,department:document.getElementById('department').value,leaveType:document.getElementById('leaveType').value,leaveDuration:document.querySelector('input[name="leaveDuration"]:checked').value,singleDate:document.getElementById('singleDate').value,startDate:document.getElementById('startDate').value,endDate:document.getElementById('endDate').value,totalDays:document.getElementById('totalDays').value,reason:document.getElementById('reason').value,schoolName:document.getElementById('schoolName').value,schoolAddress:document.getElementById('schoolAddress').value}}
        function loadFormData(d){if(d.instType){document.querySelector('input[name="instType"][value="'+d.instType+'"]').checked=true;toggleInstType()}document.getElementById('customHead').value=d.customHead||'';document.getElementById('applicantName').value=d.applicantName||'';document.getElementById('designation').value=d.designation||'';document.getElementById('department').value=d.department||'';document.getElementById('leaveType').value=d.leaveType||'বেতনহীন ছুটি';document.getElementById('singleDate').value=d.singleDate||'';document.getElementById('startDate').value=d.startDate||'';document.getElementById('endDate').value=d.endDate||'';document.getElementById('totalDays').value=d.totalDays||'';document.getElementById('reason').value=d.reason||'';document.getElementById('schoolName').value=d.schoolName||'উদাহরণ উচ্চ বিদ্যালয়';document.getElementById('schoolAddress').value=d.schoolAddress||'গ্রাম: উদাহরণ, জেলা: উদাহরণ';if(d.leaveDuration==='multiple'){document.querySelector('input[name="leaveDuration"][value="multiple"]').checked=true}toggleDateFields()}
        function saveApplication(){var n=document.getElementById('saveName').value.trim();var s=document.getElementById('applicantName').value.trim();if(!n)n=s||'আবেদন';if(!s){showToast('⚠️ প্রথমে আবেদনকারীর নাম লিখুন!','error');return}var d=getFormData();d.saveName=n;d.id=Date.now();d.savedDate=new Date().toLocaleString('bn-BD');var a=JSON.parse(localStorage.getItem('teacherLeaveApps')||'[]');a.unshift(d);localStorage.setItem('teacherLeaveApps',JSON.stringify(a));document.getElementById('saveName').value='';renderSavedList();showToast('✅ "'+n+'" সেভ হয়েছে!','success')}
        function loadApplication(id){var a=JSON.parse(localStorage.getItem('teacherLeaveApps')||'[]');var d=a.find(function(x){return x.id===id});if(d){loadFormData(d);showToast('✅ "'+d.saveName+'" লোড হয়েছে!','success')}}
        function deleteApplication(id){if(!confirm('আপনি কি এই আবেদনটি মুছে ফেলতে চান?'))return;var a=JSON.parse(localStorage.getItem('teacherLeaveApps')||'[]');a=a.filter(function(x){return x.id!==id});localStorage.setItem('teacherLeaveApps',JSON.stringify(a));renderSavedList();showToast('🗑️ আবেদন মুছে ফেলা হয়েছে!','success')}
        function renderSavedList(){var a=JSON.parse(localStorage.getItem('teacherLeaveApps')||'[]');var l=document.getElementById('savedList');document.getElementById('counter').textContent='সর্বমোট: '+toBengaliNumber(a.length)+'টি';if(a.length===0){l.innerHTML='<div class="no-saved">কোনো সেভ করা আবেদন নেই</div>';return}l.innerHTML=a.map(function(x,i){return'<div class="saved-item"><div class="saved-info"><div class="saved-name">'+(i+1)+'. '+x.saveName+'</div><div class="saved-date">'+x.savedDate+' | '+x.leaveType+'</div></div><div class="saved-actions"><button class="btn-load" onclick="loadApplication('+x.id+')">লোড</button><button class="btn-delete" onclick="deleteApplication('+x.id+')">✕</button></div></div>'}).join('')}
        function exportJSON(){var a=JSON.parse(localStorage.getItem('teacherLeaveApps')||'[]');if(a.length===0){showToast('⚠️ কোনো সেভ করা আবেদন নেই!','error');return}var b=new Blob([JSON.stringify(a,null,2)],{type:'application/json'});var u=URL.createObjectURL(b);var l=document.createElement('a');l.href=u;l.download='teacher_leave_apps_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();document.body.removeChild(l);showToast('📤 JSON ফাইল ডাউনলোড হয়েছে!','success')}
        function importJSON(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(x){try{var d=JSON.parse(x.target.result);if(!Array.isArray(d)){showToast('❌ অবৈধ JSON ফাইল!','error');return}var a=JSON.parse(localStorage.getItem('teacherLeaveApps')||'[]');d.forEach(function(x){x.id=Date.now()+Math.random();x.savedDate=new Date().toLocaleString('bn-BD')});a=d.concat(a);localStorage.setItem('teacherLeaveApps',JSON.stringify(a));renderSavedList();showToast('✅ '+toBengaliNumber(d.length)+'টি আবেদন ইম্পোর্ট হয়েছে!','success')}catch(err){showToast('❌ JSON ফাইল পড়তে সমস্যা!','error')}};r.readAsText(f);e.target.value=''}
        document.getElementById('leaveForm').addEventListener('submit',function(e){e.preventDefault();var h=getHeadTitle();var s=document.querySelector('input[name="leaveDuration"]:checked').value==='single';var d={applicantName:document.getElementById('applicantName').value,designation:document.getElementById('designation').value,department:document.getElementById('department').value,leaveType:document.getElementById('leaveType').value,isSingleDay:s,singleDate:formatDate(document.getElementById('singleDate').value),startDate:formatDate(document.getElementById('startDate').value),endDate:formatDate(document.getElementById('endDate').value),totalDays:document.getElementById('totalDays').value,reason:document.getElementById('reason').value,schoolName:document.getElementById('schoolName').value,schoolAddress:document.getElementById('schoolAddress').value,applicationDate:getBengaliDate()};var t=toBengaliNumber(d.totalDays);var dept=d.department?' ('+d.department+' বিভাগ)':'';var dur=d.isSingleDay?'<strong>'+d.singleDate+'</strong> তারিখে একদিনের <strong>'+d.leaveType+'</strong> প্রয়োজন।':'<strong>'+d.startDate+'</strong> তারিখ হতে <strong>'+d.endDate+'</strong> তারিখ পর্যন্ত মোট <strong>'+t+'</strong> দিনের <strong>'+d.leaveType+'</strong> প্রয়োজন।';document.getElementById('applicationLetter').innerHTML='<div class="letter-date">তারিখ: '+d.applicationDate+'</div><div style="margin-bottom:15px">বরাবর,<br><strong>'+h+' </strong><br>'+d.schoolName+'<br>'+d.schoolAddress+'</div><div class="letter-subject">বিষয়: <strong>'+d.leaveType+'</strong>র জন্য আবেদন।</div><div style="margin-bottom:15px">জনাব,</div><div class="letter-body">বিনীত নিবেদন এই যে, আমি <strong>'+d.applicantName+'</strong>, আপনার প্রতিষ্ঠানের একজন <strong>'+d.designation+'</strong>'+dept+' হিসেবে কর্মরত আছি। আমার <strong>'+d.reason+'</strong> কারণে '+dur+'</div><div class="letter-body">এই মর্মে আমি আপনার নিকট উক্ত <strong>'+d.leaveType+'</strong>র জন্য আবেদন করছি। মহোদয়, আমার আবেদন অনুকূলে বিবেচনা করে প্রয়োজনীয় ব্যবস্থা গ্রহণের জন্য বিনীত অনুরোধ করছি।</div><div class="letter-body" style="margin-bottom:30px">ধন্যবাদান্তে,</div><div class="letter-signature"><div class="signature-content"><div>বিনীত,</div><div style="margin-top:40px"><strong>( '+d.applicantName+' )</strong></div><div>'+d.designation+'</div>'+(d.department?'<div>'+d.department+' বিভাগ</div>':'')+'</div></div>';document.getElementById('placeholder').style.display='none';document.getElementById('output').style.display='block'});
        function resetForm(){document.getElementById('leaveForm').reset();document.getElementById('schoolName').value='উদাহরণ উচ্চ বিদ্যালয়';document.getElementById('schoolAddress').value='গ্রাম: উদাহরণ, জেলা: উদাহরণ';document.getElementById('placeholder').style.display='block';document.getElementById('output').style.display='none';toggleDateFields();toggleInstType()}
        function updateMargin(v){document.documentElement.style.setProperty('--margin-size',v+'px');document.getElementById('marginValue').textContent=v+'px'}
        function updateLineHeight(v){document.documentElement.style.setProperty('--line-height',v);document.getElementById('lineHeightValue').textContent=parseFloat(v).toFixed(1)}
        function updateFontSize(v){document.documentElement.style.setProperty('--font-size',v+'px');document.getElementById('fontSizeValue').textContent=v+'px'}
        toggleDateFields();toggleInstType();updateMargin(20);updateLineHeight(2);updateFontSize(16);renderSavedList();
    </script>
</body>
